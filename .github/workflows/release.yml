name: Build portable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build or refresh"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish portable app
        shell: pwsh
        run: >-
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/app

      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = "WarThunderUIDGuard-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path artifacts/app/* -DestinationPath "artifacts/$archive"
          $hash = (Get-FileHash "artifacts/$archive" -Algorithm SHA256).Hash
          "$hash  $archive" | Set-Content "artifacts/$archive.sha256.txt"

      - name: Create or refresh GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "WarThunderUIDGuard-$env:RELEASE_TAG-win-x64.zip"
          $assets = @(
            "artifacts/$archive",
            "artifacts/$archive.sha256.txt"
          )

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $env:RELEASE_TAG @assets `
              --repo $env:GITHUB_REPOSITORY `
              --title "War Thunder UID Guard $env:RELEASE_TAG" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
