name: Build portable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build or refresh"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish portable app
        shell: pwsh
        run: >-
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/app

      - name: Run release self-tests
        shell: pwsh
        run: dotnet run -c Release --no-build -- --self-test

      - name: Add license and privacy notices
        shell: pwsh
        run: |
          Copy-Item -LiteralPath LICENSE -Destination artifacts/app/LICENSE.txt
          Copy-Item -LiteralPath PRIVACY.md -Destination artifacts/app/PRIVACY.md
          Copy-Item -LiteralPath SECURITY.md -Destination artifacts/app/SECURITY.md

      - name: Require SignPath release configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "Signed release is not configured. Missing: $($missing -join ', ')"
          }

      - name: Upload unsigned executable for trusted signing
        id: upload-unsigned-executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: artifacts/app/WarThunderUIDGuard.exe
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Sign executable with SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-executable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signed
          skip-decompress: true

      - name: Verify signed executable
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem -LiteralPath artifacts/signed -File -Recurse |
            Where-Object Name -eq 'WarThunderUIDGuard.exe')
          if ($signed.Count -ne 1) {
            throw "SignPath returned $($signed.Count) matching executables; expected exactly one."
          }
          Copy-Item -LiteralPath $signed[0].FullName `
            -Destination artifacts/app/WarThunderUIDGuard.exe -Force
          $signature = Get-AuthenticodeSignature -LiteralPath artifacts/app/WarThunderUIDGuard.exe
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode verification failed: $($signature.StatusMessage)"
          }
          if ($null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw 'The executable was not signed by SignPath Foundation.'
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw 'The executable has no trusted timestamp.'
          }

      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = "WarThunderUIDGuard-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path artifacts/app/* -DestinationPath "artifacts/$archive"
          $hash = (Get-FileHash "artifacts/$archive" -Algorithm SHA256).Hash
          "$hash  $archive" | Set-Content "artifacts/$archive.sha256.txt"

      - name: Create or refresh GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "WarThunderUIDGuard-$env:RELEASE_TAG-win-x64.zip"
          $assets = @(
            "artifacts/$archive",
            "artifacts/$archive.sha256.txt"
          )

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $env:RELEASE_TAG @assets `
              --repo $env:GITHUB_REPOSITORY `
              --title "War Thunder UID Guard $env:RELEASE_TAG" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
