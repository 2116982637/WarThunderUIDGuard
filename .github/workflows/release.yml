name: Build portable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build or refresh"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Run release self-tests
        shell: pwsh
        run: dotnet run -c Release -- --self-test

      - name: Publish portable app
        shell: pwsh
        run: >-
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/app

      - name: Add license and privacy notices
        shell: pwsh
        run: |
          ($env:RELEASE_TAG -replace '^v', '') | Set-Content -LiteralPath artifacts/app/VERSION.txt -Encoding ascii
          Copy-Item -LiteralPath LICENSE -Destination artifacts/app/LICENSE.txt
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.md -Destination artifacts/app/THIRD_PARTY_NOTICES.md
          Copy-Item -LiteralPath PRIVACY.md -Destination artifacts/app/PRIVACY.md
          Copy-Item -LiteralPath SECURITY.md -Destination artifacts/app/SECURITY.md

          $runtimePackRoot = Join-Path $env:USERPROFILE `
            '.nuget\packages\microsoft.netcore.app.runtime.win-x64'
          $runtimePack = Get-ChildItem -LiteralPath $runtimePackRoot -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $runtimePack) {
            throw 'The .NET runtime license pack was not restored.'
          }
          Copy-Item -LiteralPath (Join-Path $runtimePack.FullName 'LICENSE.TXT') `
            -Destination artifacts/app/DOTNET-RUNTIME-LICENSE.txt
          Copy-Item -LiteralPath (Join-Path $runtimePack.FullName 'THIRD-PARTY-NOTICES.TXT') `
            -Destination artifacts/app/DOTNET-RUNTIME-THIRD-PARTY-NOTICES.txt

      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = "WarThunderUIDGuard-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path artifacts/app/* -DestinationPath "artifacts/$archive"
          $hash = (Get-FileHash "artifacts/$archive" -Algorithm SHA256).Hash
          "$hash  $archive" | Set-Content "artifacts/$archive.sha256.txt"

      - name: Create or refresh GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "WarThunderUIDGuard-$env:RELEASE_TAG-win-x64.zip"
          $assets = @(
            "artifacts/$archive",
            "artifacts/$archive.sha256.txt"
          )

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $env:RELEASE_TAG @assets `
              --repo $env:GITHUB_REPOSITORY `
              --title "War Thunder UID Guard $env:RELEASE_TAG" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
