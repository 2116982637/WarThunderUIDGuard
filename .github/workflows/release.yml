name: Build portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish portable app
        shell: pwsh
        run: >-
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/app

      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = "WarThunderUIDGuard-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path artifacts/app/* -DestinationPath "artifacts/$archive"
          $hash = (Get-FileHash "artifacts/$archive" -Algorithm SHA256).Hash
          "$hash  $archive" | Set-Content "artifacts/$archive.sha256.txt"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "artifacts/WarThunderUIDGuard-${{ github.ref_name }}-win-x64.zip"
          "artifacts/WarThunderUIDGuard-${{ github.ref_name }}-win-x64.zip.sha256.txt"
          --title "War Thunder UID Guard ${{ github.ref_name }}"
          --generate-notes
