# Install as /etc/nginx/conf.d/warthunder-uid-guard.conf.
# Existing released clients require plain HTTP on port 8443.
server {
    listen 8443 default_server;
    listen [::]:8443 default_server;
    server_name _;

    root /srv/wtuidguard/www;
    autoindex off;
    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/warthunder-uid-guard-access.log;
    error_log  /var/log/nginx/warthunder-uid-guard-error.log warn;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The desktop UI probes this once per second while visible. Keep the
    # response bodyless and out of access logs to avoid unbounded log growth.
    location = /health {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    location = /admin/upload {
        if ($request_method != POST) { return 404; }

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 45s;

        # Overwrite, rather than append, untrusted client forwarding headers.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location = /blacklist.json {
        try_files $uri =404;
    }

    location = /blacklist.sig {
        try_files $uri =404;
    }

    location = /signing-public.xml {
        try_files $uri =404;
    }

    # Refresh jobs use hidden same-filesystem temporary names for atomic writes.
    # They must never be reachable while a file is still being prepared.
    location ^~ /updates/. {
        return 404;
    }

    location ^~ /updates/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
